<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>Scan | QR Guys Clothing Co.</title><style>body{font:18px/1.6 system-ui;margin:0;background:#101516;color:#f5f5f5}main{max-width:720px;margin:8vh auto;padding:24px}a{color:#44ded4}#content{white-space:pre-wrap;overflow-wrap:anywhere}img{max-width:100%;height:auto;border-radius:12px}.brand{font-weight:bold}#status{color:#bbb}</style></head><body><main><a class="brand" href="/">QR Guys Clothing Co.</a><p id="status" role="status">Opening this QR code…</p><section id="content" aria-live="polite"></section><small>Operated by MWM Visionary Solutions</small></main><script type="module">
import { renderContent } from './js/scan-content.mjs';
const status = document.querySelector('#status');
const content = document.querySelector('#content');
const linkId = new URLSearchParams(location.search).get('linkId');
if (!linkId || !/^[A-Za-z0-9_-]{1,128}$/.test(linkId)) {
  status.textContent = 'This QR link is incomplete or invalid.';
} else {
  try {
    const response = await fetch('/api/resolve-apparel?linkId=' + encodeURIComponent(linkId), {credentials:'omit', cache:'no-store'});
    if (!response.ok) throw new Error('unavailable');
    const payload = await response.json();
    renderContent(document, content, payload);
    status.textContent = 'Shared by the owner of this QR clothing.';
  } catch {
    content.replaceChildren();
    status.textContent = 'This QR content is not available. The owner may not have published it yet. Please try again later.';
  }
}
</script></body></html>
